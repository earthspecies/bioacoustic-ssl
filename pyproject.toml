[project]
name = "soundscape-ssl"
version = "1.0.0"
description = "A simple boiler plate for continuous integration and good practices of ESP projects."
readme = "README.md"

requires-python = ">=3.12,<3.14"

dependencies = [
  "datasets",
  "esp-data>=1.9.0",
  "huggingface-hub",
  "hydra-core>=1.3.2",
  "hydra-submitit-launcher>=1.2.0",
  "lightning>=2.0.0",
  "matplotlib>=3.10.9",
  "soundfile>=0.12.1",
  "tenacity>=9.1.4",
  "torch-audiomentations>=0.12.0",
  "tqdm>=4.0.0",
  "transformers>=5.6.1",
  "wandb>=0.26.1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.34.0",
  "deptry>=0.23.1",
  "isort>=6.1.0",
  "mike>=2.1.3",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.21",
  "mkdocstrings-python>=1.18.2",
  "mypy>=1.18.2",
  "prek>=0.2.28",
  "pytest>=8.4.2",
  "ruff>=0.11.2",
  "ty>=0.0.9", # TODO: decide if we want to keep this after experimenting
  "keyrings-google-artifactregistry-auth>=1.1.2",
  "yamllint>=1.37.1",
  "pytest-asyncio>=0.25.0",
]

cpu = [
  "torch>=2.2.0",
  "torchaudio",
  "torchvision",
  "torchcodec"
]

gpu = [
  "torch>=2.2.0",
  "torchaudio",
  "torchvision",
  "torchcodec"
]


[project.urls]
Homepage = "https://github.com/earthspecies/PyProjectStarterPack"
Repository = "https://github.com/earthspecies/PyProjectStarterPack"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
keyring-provider = "subprocess"
default-groups = ["dev", "gpu"]
conflicts = [
  [
    { group = "cpu" },
    { group = "gpu" },
  ],
]

[[tool.uv.index]]
name = "esp-pypi"
url = "https://oauth2accesstoken@us-central1-python.pkg.dev/okapi-274503/esp-pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.uv.sources]
esp-data = { index = "esp-pypi" }
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu124", group = "gpu", marker = "platform_system == 'Linux'" },
]
torchaudio = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu124", group = "gpu", marker = "platform_system == 'Linux'" },
]
torchvision = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu124", group = "gpu", marker = "platform_system == 'Linux'" },
]
torchcodec = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu124", group = "gpu", marker = "platform_system == 'Linux'" },
]


[tool.pytest.ini_options]
python_files = [
    "test_*.py",
    "check_*.py",
]


[tool.ruff]
line-length = 120
indent-width = 4
exclude = ["tests", "scripts", "docs/hooks"]
src = ["src", "projects/*", "projects/*/src"]


[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP007", # Check for typing.Union annotations that can be rewritten with PEP 604 syntax
  "UP045", # Check for typing.Optional annotations that can be rewritten with PEP 604 syntax
]
extend-select = ["DOC", "B9", "B", "E", "W", "ANN"]
fixable = ["ALL"]
unfixable = []
preview = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 10.
max-complexity = 10

[tool.codespell]
skip = "*.csv"

[tool.deptry.per_rule_ignores]
DEP004 = [
  "torch", # torch is defined in groups and deptry doesn't seem to understand uv groups
]
