# =============================================================================
# run_manifest.yaml — the pinned map from every published number to its W&B run
# =============================================================================
#
# ADR 0001. This file is the source of truth for which run backs which table
# cell, and it is maintained BY HAND. It was authored on 2026-08-25 and revised
# on 2026-08-29, both times by resolving W&B *config fields* — never run names —
# for every run in the project (444 at authoring, 476 at revision):
#
#   benchmark      <- data.datasets.test.dataset_name
#   task / split   <- data.datasets.test.split
#   label space    <- len(data.datasets.test.transformations[].class_ids)
#   head           <- (module.model._target_, module.freeze_backbone,
#                      module.model.mixer);  freeze_backbone absent == frozen
#   backbone       <- basename(trainer.resume_from_checkpoint)
#   seed           <- seed
#
# Run-name parsing is known-quirky in this project (trailing head suffixes,
# per-era backbone tokens, one basename colliding across encoders), which is why
# the ids are pinned here instead of being re-derived downstream. Do not
# regenerate this file from names; edit it.
#
# Two traps this file exists to disarm:
#
#   1. `xc_masked` runs log
#      trainer.resume_from_checkpoint=/home/.../soundscape_ssl/checkpoints/XC.ckpt
#      — a path that exists nowhere. Their arm comes from `head_tag` and the head
#      weights from trainer.resume_from_state. Never resolve them by checkpoint.
#   2. `XC_400k` NES/PER/SNE looks like it has two post-repair runs (2026-08-19
#      and 2026-08-21). It does not: the 08-21 run is the block-diagonal mixer
#      (head `layerwise_blockdiag`), a different head. There are no duplicate
#      cells in the published frame — verified by grouping on
#      (arm, head, benchmark, task, seed, label space).
#
# The 2026-08-20 BirdSet label-space repair splits three tasks into two eras.
# cmAP is a macro mean over exactly the classes in `class_ids`, so a pre-repair
# and a post-repair number on the same task average over different class sets.
# `restored_classes` below gives the gbifID the repair added, derived from the
# class_ids diff between the two eras (not from the eBird crosswalk).
#
# Conversion runs ONE WAY. A post-repair run logs test_AP_per_class/<gbifID>, so
# dropping the restored class recovers its pre-repair number exactly. A
# pre-repair run has no AP for the restored class and can never be lifted onto
# the repaired space.
#
project: mwirth/soundscape_ssl
authored: 2026-08-25
revised: 2026-08-29
schema_version: 1

restored_classes:
  NES: {gbif_id: 5231482, classes_pre: 88, classes_post: 89}
  PER: {gbif_id: 5228935, classes_pre: 131, classes_post: 132}
  SNE: {gbif_id: 9568685, classes_pre: 55, classes_post: 56}

# Only `XC_1M` ships as weights (ADR 0002, revised 2026-08-25), together with the
# full-XC probe trained on it. The other arms survive as numbers in this cache
# only; their checkpoints do not outlive cluster access.
arms:
  XC_1M: {checkpoint: XC_1M.ckpt, corpus: "XC only", pretrain_steps: 1000000, published_weights: true, note: "the released base encoder"}
  XC_400k: {checkpoint: XC_400k_cold.ckpt, corpus: "XC only", pretrain_steps: 400000, published_weights: false, note: "cold-start 400k baseline (2026-08-13)"}
  NASA_ev_400k: {checkpoint: XC_nasa_400k.ckpt, corpus: "XC + NASA events", pretrain_steps: 400000, published_weights: false}
  NASA_ev_1M: {checkpoint: XC_nasa_1M.ckpt, corpus: "XC + NASA events", pretrain_steps: 1000000, published_weights: false}
  NASA_rg_400k: {checkpoint: XC_nasa_400k_v2.ckpt, corpus: "XC + NASA regions v2", pretrain_steps: 400000, published_weights: false}
  NASA_rg50_400k: {checkpoint: XC_nasa_50_400k.ckpt, corpus: "XC + NASA regions bal.", pretrain_steps: 400000, published_weights: false}
  AudioMAE: {checkpoint: audiomae.ckpt, corpus: "external (AudioSet)", pretrain_steps: null, published_weights: false, note: "converted by scripts/convert_external_ckpt.py"}
  BirdMAE_Base: {checkpoint: birdmae_base.ckpt, corpus: "external (XCL)", pretrain_steps: null, published_weights: false, note: "converted by scripts/convert_external_ckpt.py"}
  BAT: {checkpoint: null, corpus: "external (bat baseline)", pretrain_steps: null, published_weights: false}

heads:
  layerwise: "frozen encoder, learned softmax fusion of all 12 blocks, dense prototypical mixer. The metric of record."
  layerwise_blockdiag: "as `layerwise` but with the block-diagonal prototype mixer (`BD-*` runs)."
  layerwise_finetune: "`layerwise` with the encoder unfrozen."
  final_layer: "frozen encoder, last block only, prototypical head."
  finetune: "`final_layer` with the encoder unfrozen."
  linear: "frozen encoder, linear classifier."
  xc_masked: "the released full-XC head (11 737 taxa) scored on a BirdSet task by logit masking. Not comparable to the per-task probes: same weights for every task, no per-task training."

# Not in `rows`, with the decision that keeps them out:
#   - retired warm-restart arms (XC, XC_long, XC_terrestrial, XC_terra_marine,
#     XC_terra_marine_long): no claim may rest on them (spec, story 9) — a
#     schedule effect there is contaminated by an init effect. The three
#     `terra` arms are also the only ones ever pretrained on A2O, Arbimon or
#     NOAA; ADR 0004 drops Arbimon on license grounds and leaves A2O and NOAA
#     as unused-but-runnable, so no corpus but XC and NASA backs a row below.
#   - the step sweep (step_0*.ckpt): covers 3 of 8 tasks on two step grids and
#     cannot produce a test mean.
#   - the PupuJEPA baseline: its weights are third-party and were never
#     redistributable, so the arm was removed from the codebase (2026-08-29)
#     and no published number may rest on it.
#   - crashed runs and runs with no test metric.
excluded:
  - {runs: 24, reason: "PupuJEPA arm (third-party weights, not redistributable; removed from the codebase 2026-08-29)"}
  - {runs: 48, reason: "step sweep (cannot produce a test mean)"}
  - {runs: 16, reason: "not an eval run (pretraining, or full-XC head training)"}
  - {runs: 18, reason: "retired warm-restart arm (XC_terrestrial.ckpt) — pretrained on XC + A2O + Arbimon"}
  - {runs: 16, reason: "retired warm-restart arm (XC.ckpt)"}
  - {runs: 16, reason: "retired warm-restart arm (XC_long.ckpt)"}
  - {runs: 13, reason: "retired warm-restart arm (XC_terra_marine.ckpt) — pretrained on XC + A2O + Arbimon + NOAA"}
  - {runs: 13, reason: "retired warm-restart arm (XC_terra_marine_long.ckpt) — pretrained on XC + A2O + Arbimon + NOAA"}
  - {runs: 8, reason: "head-capacity arm (head_tag XC_1M-p10-f4); its final-layer counterpart was still training"}
  - {runs: 21, reason: "crashed or failed"}
  - {runs: 2, reason: "still running at revision time"}

