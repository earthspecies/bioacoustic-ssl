# @package _global_

# Layerwise prototypical probing of PupuJEPA-Base: same protocol and
# preprocessing as sweeps/proto/birdset/pupujepa, but the head learns a
# softmax-weighted sum over ALL transformer block outputs instead of probing only
# the final layer (see PupuJepaProtoLayerwise). This is the GATE-0 readout — it
# reports *where* the transferable features sit, directly comparable to the same
# readout on our own encoder and on Bird-MAE / AudioMAE.
#
# The MAE argument for probing layerwise (final layers specialise for pixel
# reconstruction) does not transfer to a JEPA, whose target is a latent produced
# by its own EMA teacher — so an early/middle-layer peak here would mean
# something different than it does for the MAE arms. Worth stating wherever the
# layer profile is reported.
#
# Same two caveats as the final-layer sweep (1000 tokens vs 257; no CLS token, so
# focal similarity references the mean patch token), plus one of its own: the
# layerwise head keeps all 12 block outputs and their trainable per-block
# LayerNorms live for backward, so activation memory is several times the
# final-layer arm's. See the sizing note in the launcher script.
#
# As with the final-layer sweep, `resume_from_checkpoint` must be nulled in the
# sweeper params below — weights arrive at construction from `ckpt_path`.

defaults:
  - override /data: train
  - override /data/loaders: default
  - override /data/transforms: pupujepa
  - override /module/model: layerwise/pupujepa

module:
  # Frozen encoder: only the head and the layerwise-fusion params
  # (layer_weights, layer_norms) train — see
  # PupuJepaProtoLayerwise.freeze_backbone.
  freeze_backbone: true

# The trailing `-layerwise` is what the eval-aggregation tooling strips to
# recover the backbone token, so keep it last.
run_name: ${data.datasets.test.split}-PupuJEPA-${seed}-layerwise

hydra:
  sweeper:
    params:
      seed: 1
      # Must be nulled *here*, not in a `trainer:` block above — see
      # sweeps/proto/birdset/pupujepa.yaml for why.
      trainer.resume_from_checkpoint: 'null'
      data/datasets: train/birdset/hsn, train/birdset/nbp, train/birdset/nes, train/birdset/per, train/birdset/pow, train/birdset/sne, train/birdset/ssw, train/birdset/uhh
