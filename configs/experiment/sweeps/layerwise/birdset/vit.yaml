# @package _global_

# Layerwise prototypical probing: same protocol as sweeps/proto/birdset/vit, but the
# head learns a softmax-weighted sum over ALL transformer block outputs instead
# of probing only the final layer (see ViTProtoLayerwise). Useful for the MAE
# encoder-decoder problem where the best transferable features may sit in a
# middle layer rather than the last.

defaults:
  - override /data: train
  - override /data/loaders: a100
  - override /module/model: layerwise/vit

run_name: ${data.datasets.test.split}-${trainer.resume_from_checkpoint}-${seed}-layerwise


hydra:
  sweeper:
    params:
      seed: 1
      #data/datasets: train/birdset/hsn, train/birdset/nbp, train/birdset/nes, train/birdset/per, train/birdset/pow, train/birdset/sne, train/birdset/ssw, train/birdset/uhh
      data/datasets: train/birdset/hsn, train/birdset/pow, train/birdset/per
      #data/datasets: train/birdset/nbp, train/birdset/nes, train/birdset/per, train/birdset/pow, train/birdset/sne, train/birdset/ssw, train/birdset/uhh
      #data/datasets: train/birdset/nes, train/birdset/per, train/birdset/pow, train/birdset/sne, train/birdset/ssw, train/birdset/uhh
