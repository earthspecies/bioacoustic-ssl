# @package _global_

defaults:
  - override /data: train
  - override /data/loaders: a100
  - override /data/transforms: multiclass
  - override /module/metrics: [acc]
  - override /module/loss: ce
  - override /module/model: layerwise/vit


data:
  class_weighting:
    enabled: false
  weights: null


hydra:
  sweeper:
    params:
      seed: 1
      data/datasets: train/beans/bats, train/beans/cbi, train/beans/dogs, train/beans/esc50, train/beans/humbugdb, train/beans/watkins
      trainer.resume_from_checkpoint: ${paths.ckpt_dir}/XC_400k_cold.ckpt, ${paths.ckpt_dir}/XC_nasa_400k_v2.ckpt
