# @package _global_

# The two `cbi` cells missing from the BEANS layerwise grid: `XC + NASA (400k)`
# and `XC + NASA (1M)`.
#
# cbi is the focal-audio task in BEANS, so it is the one task where the
# focal-versus-non-focal pattern can be read off BEANS at all — the NASA arms
# cannot be left out of it. It is also the slowest BEANS task (~4 h/run).

defaults:
  - override /data: train
  - override /data/loaders: a100
  - override /data/transforms: multiclass
  - override /module/metrics: [acc]
  - override /module/loss: ce
  - override /module/model: layerwise/vit

data:
  class_weighting:
    enabled: false
  weights: null

hydra:
  sweeper:
    params:
      seed: 1
      data/datasets: train/beans/cbi
      trainer.resume_from_checkpoint: /home/moritz_earthspecies_org/soundscape_mae/checkpoints/XC_nasa_400k.ckpt, /home/moritz_earthspecies_org/soundscape_mae/checkpoints/XC_nasa_1M.ckpt
