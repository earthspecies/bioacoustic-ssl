# @package _global_

# Frozen prototypical probing of the published BAT ViT-B/16 (AudioSet-2M) encoder
# across the BirdSet downstream tasks, using BAT's own preprocessing (16 kHz mel,
# hop 160, per-sample min-max, 1024 frames) rather than ours.
#
# Everything except the backbone and its front-end is inherited unchanged from
# the other proto-probing sweeps (base_lr, prototype_lr, layer_decay, loss,
# metrics, max_steps), so this is a clean cross-model contrast.
#
# No checkpoint step: `proto/bat` pulls the weights from the Hub at construction
# with `strict=True`, so `resume_from_checkpoint` stays null. Pointed at one of
# our own XC checkpoints it would hand `_load_checkpoint` keys that, once
# `encoder.`-stripped, match nothing in this model — `strict=False` would report
# that and carry on, i.e. fail silently.
#
# Caveat for the comparison: this arm sees a 10.24 s window (513 tokens, ~51 % of
# it zero padding) against every other arm's 5 s / 257 tokens.

defaults:
  - override /data: train
  - override /data/loaders: a100
  - override /data/transforms: bat
  - override /module/model: proto/bat

module:
  # Frozen encoder: only head.prototype_vectors and head.linear.* train.
  # This is birdset_eval.py's default, stated explicitly to contrast with
  # sweeps/finetune/birdset/vit.yaml.
  freeze_backbone: true

# `BAT` stands in for the checkpoint token the other arms interpolate here, so
# the name keeps the <split>-<backbone>-<seed> shape the eval-aggregation
# tooling parses.
run_name: ${data.datasets.test.split}-BAT-${seed}

hydra:
  sweeper:
    params:
      seed: 1
      # Restated even though `trainer/train.yaml` already defaults to null: it
      # must be null for this arm, and a `trainer:` block above would not be able
      # to enforce it (train.yaml's defaults list merges the `trainer` group
      # AFTER `experiment`, so only a sweeper/CLI override outranks it).
      trainer.resume_from_checkpoint: 'null'
      data/datasets: train/birdset/hsn, train/birdset/nbp, train/birdset/nes, train/birdset/per, train/birdset/pow, train/birdset/sne, train/birdset/ssw, train/birdset/uhh
