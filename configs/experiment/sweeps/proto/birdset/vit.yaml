# @package _global_

# Frozen prototypical probing of OUR OWN MAE checkpoints (final layer) across the
# BirdSet downstream tasks. The reference protocol every other sweep under
# sweeps/ is a single-factor variation of: sweeps/proto/birdset/{birdmae,
# audiomae,bat} swap the backbone, sweeps/layerwise/ swaps the readout,
# sweeps/linear/ swaps the head, sweeps/finetune/ unfreezes the encoder.

defaults:
  - override /data: train
  - override /data/loaders: a100
  - override /module/model: proto/vit



hydra:
  sweeper:
    params:
      seed: 1
      data/datasets: train/birdset/hsn, train/birdset/nbp, train/birdset/nes, train/birdset/per, train/birdset/pow, train/birdset/sne, train/birdset/ssw, train/birdset/uhh
      trainer.resume_from_checkpoint: ${paths.ckpt_dir}/XC_long.ckpt # xc (long)
