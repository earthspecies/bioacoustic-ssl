# @package _global_

# Frozen prototypical probing of PupuJEPA-Base (latent-predictive I-JEPA
# pretrained from scratch on pooled XenoCanto + iNaturalist + AudioSet) across
# the BirdSet downstream tasks, using PupuJEPA's own preprocessing (24 kHz
# magnitude log-mel, n_fft 1024, hop 240, 0-12 kHz, -4.0900 / 2.0242) rather
# than ours.
#
# Everything except the backbone and its front-end is inherited unchanged from
# the other proto-probing sweeps (base_lr, prototype_lr, layer_decay, loss,
# metrics, max_steps), so this is a clean cross-model contrast. Unlike every
# other arm this one is a JEPA rather than an MAE, so it is also the first
# datapoint on whether the latent-predictive objective transfers differently.
#
# No checkpoint step: `proto/pupujepa` loads its local `ckpt_path` at
# construction, per submodule with strict=True, so `resume_from_checkpoint` is
# nulled below. Leaving the `trainer/train.yaml` default in place would hand
# `_load_checkpoint` one of our own XC checkpoints, whose `encoder.`-stripped
# keys match nothing in this model — `strict=False` would report that and carry
# on, i.e. fail silently.
#
# Two caveats for the comparison, both in docs/external_baselines.md:
#   * 1000 tokens at 5 s against every other arm's 257, because the patch is 4
#     frames wide rather than 16. No padding is involved (RoPE is generated per
#     input grid), but it costs ~4x the activation memory and ~4-6x the step
#     time. See the sizing note in the launcher script.
#   * PupuJEPA has no CLS token, so the shared head's focal-similarity
#     subtraction references the mean patch token instead. That mean is the clip
#     embedding upstream itself publishes, but it is a substitute.
#
# Verify the arm reproduces upstream bit-for-bit before trusting any number
# here: `sbatch scripts/slurm/verify_pupujepa_cpu.sh`.

defaults:
  - override /data: train
  - override /data/loaders: default
  - override /data/transforms: pupujepa
  - override /module/model: proto/pupujepa

module:
  # Frozen encoder: only head.prototype_vectors and head.linear.* train.
  # This is birdset_eval.py's default, stated explicitly to contrast with
  # sweeps/finetune/birdset/vit.yaml.
  freeze_backbone: true

# `PupuJEPA` stands in for the checkpoint token the other arms interpolate here,
# so the name keeps the <split>-<backbone>-<seed> shape the eval-aggregation
# tooling parses.
run_name: ${data.datasets.test.split}-PupuJEPA-${seed}

hydra:
  sweeper:
    params:
      seed: 1
      # Must be nulled *here*, not in a `trainer:` block above: train.yaml's
      # defaults list merges the `trainer` group after `experiment`, so only a
      # sweeper/CLI override outranks trainer/train.yaml's default path. Left
      # set, `_load_checkpoint` would strip `encoder.` off one of our own XC
      # checkpoints, match nothing in this model, and report that under
      # strict=False instead of failing.
      trainer.resume_from_checkpoint: 'null'
      data/datasets: train/birdset/hsn, train/birdset/nbp, train/birdset/nes, train/birdset/per, train/birdset/pow, train/birdset/sne, train/birdset/ssw, train/birdset/uhh
