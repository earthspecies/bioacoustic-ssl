# @package _global_

# The one `cbi` cell missing from the BEANS final-layer grid: `XC + NASA (400k)`.
# Without it the final-layer BEANS table has no NASA arm on the focal task, and
# its mean is over 5 tasks against the warm XC row's 6.
#
# Protocol identical to sweeps/proto/beans/vit; only the checkpoint and task are
# pinned.

defaults:
  - override /data: train
  - override /data/loaders: a100
  - override /data/transforms: multiclass
  - override /module/metrics: [acc]
  - override /module/loss: ce
  - override /module/model: proto/vit

data:
  class_weighting:
    enabled: false
  weights: null

hydra:
  sweeper:
    params:
      seed: 1
      data/datasets: train/beans/cbi
      trainer.resume_from_checkpoint: ${paths.ckpt_dir}/XC_nasa_400k.ckpt
