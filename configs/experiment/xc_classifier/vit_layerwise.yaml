# @package _global_

# Layerwise prototypical probing over ALL of Xeno-Canto — the training half of
# the HF model release. Frozen MAE encoder, learned softmax fusion of all 12
# blocks, prototypical head over all 10 799 Xeno-Canto taxa — 9 733 birds plus
# 508 amphibians, 423 insects and 135 mammals, so not a bird-only head.
#
# Relationship to the benchmark sweeps: this is sweeps/layerwise/birdset/vit with
# the species filter removed and the head's mixer swapped (see
# module/model/layerwise/vit_xc). Everything else — transforms, the
# base_lr/prototype_lr/layer_weights_lr recipe, the warmup fraction, class
# weighting — is inherited unchanged, so the release model is trained by the same
# recipe the ablation validated rather than a re-tuned one.
#
# Validation is OFF (`trainer.validate_amount: 0`). The only in-distribution
# split available is XC `validation`, which would have measured the head against
# the distribution it already trains on while saying nothing about the metric we
# actually care about — and only 3 178 of the 10 799 classes have any positive in
# it, so its macro cmAP and AUROC are structurally depressed by the ~71 % of
# classes that cannot be scored and are comparable to no BirdSet number. Worse,
# the train split is now `all`, which contains `validation`, so it would be
# scoring on training data. Watch the `train/` loss and metrics for run health
# instead.
#
# The evaluation is BirdSet with logit masking, run later against the saved
# checkpoint: restrict the 10 799 logits to a task's species and score those.
# `metadata/xc_v0.1.0_all_classes.parquet` is the map from output index to gbifID
# that masking needs. It is built from the same (version, split) pair the train
# stream reads — rebuild it with `scripts/build_xc_label_space.py` if either
# changes, or the label space and the corpus drift apart. Note that 3 BirdSet species (1 in PER, 2 in UHH) have no
# Xeno-Canto recording at all, so no head trained on XC can carry them — they
# were equally untrainable in the per-task probes.
#
# Two arms, one per backbone: XC (1M) and XC + NASA events (1M), the two 1M-step
# cold-start encoders. Frozen, so this is a readout of those encoders, not a
# re-training of them.
#
# Cost: 100 000 steps over 596 526 recordings is ~43 epochs at batch 256, ~86 at
# the batch 512 `data/loaders: pretrain` actually sets.
# Measured XC-streaming throughput puts that at 24-48 h per arm, i.e. at the
# 48 h submitit timeout — hence `save_checkpoints`. If a job times out, resume it
# with `trainer.resume_from_state=<the newest step_*.ckpt>`, which restores the
# head, the optimizer and the step; `resume_from_checkpoint` would silently
# restart from step 0 with a fresh head.

defaults:
  # The masked-validation task, composed under `val_masked.dataset` rather than
  # replacing `data/datasets` (which is the XC train stream). Only its `test`
  # entry is used; the group's `train` entry and `max_steps` are ignored.
  - /data/datasets/train/birdset/pow@val_masked.dataset
  - override /data: train
  - override /data/datasets: train/xc_all
  - override /data/loaders: pretrain
  - override /module/model: layerwise/vit_xc
  # Drop `map_per_class`, which the benchmark probes log. These are still built
  # for the *train* stream, logged every `log_every_n_steps`, so at 10 799
  # classes it would create one W&B key per species per log step. The
  # per-class breakdown that matters is per BirdSet task, and it belongs to
  # the masked evaluation.
  - override /module/metrics: [map, auroc, t1]

run_name: XCall-${trainer.resume_from_checkpoint}-${seed}-layerwise

# On-line validation against BirdSet POW by logit masking — the stopping signal
# this run did not have. `trainer.validate_amount: 0` stays 0: the XC
# `validation` split is inside the `all` train split and only ~29 % of classes
# have a positive in it, so it can neither be trusted nor compared to anything.
# This scores what the head is actually judged on instead.
#
# POW because it is BirdSet's own validation split and is already excluded from
# every published test-set mean, so selecting a checkpoint on it leaves the test
# sets untouched. Cost is one inference pass over POW-test_5s per firing
# (minutes), against 25-100 k training steps.
#
# `xc_classes` MUST be the label space the head trains on — the SAME file
# `data/datasets/train/xc_all` reads, currently the v0.1.0 `all` rebuild from
# cb93286 (10 799 classes). It is NOT the v0.2.0 file that
# `xc_classifier/birdset_masked` names: that one is 11 737 wide and belongs to
# the older heads trained before the rebuild. The builder refuses to start when
# the width disagrees with `data.num_classes`, because a mask re-indexed against
# the wrong label space reports plausible wrong numbers rather than failing —
# and the two spaces differ in both directions, so a same-width mismatch would
# not even be visible.
#
# DISABLED 2026-08-28: it crashed the run. Re-enable only once the failure is
# understood — a validator that takes the training job down is worse than no
# stopping signal, which is what the 100 k run already had. The offline route
# still works unchanged: save checkpoints often and score them in a separate job.
val_masked:
  enabled: false
  every_n_steps: 5000
  xc_classes: ${paths.root_dir}/metadata/xc_v0.1.0_all_classes.parquet
  # Score for a task species the head has no output for; any constant works —
  # it makes the class unrankable, which is the truth about it. Reported
  # separately as `*_covered`, the macro over only the predictable classes.
  uncovered_fill: -1.0e4

hydra:
  sweeper:
    params:
      seed: 1
      # Checkpointing MUST be set here, not in a `trainer:` block above:
      # train.yaml's defaults list merges the `trainer` group AFTER `experiment`,
      # so trainer/train.yaml wins over anything an experiment assigns and even
      # `override /trainer:` is rejected. Only a sweeper/CLI override outranks it
      # — the same workaround sweeps/proto/birdset/bat.yaml uses. Single-valued,
      # so it adds no sweep dimension.
      #
      # ~2.3 GB per checkpoint for the 10 799-class head (1.01 GB model +
      # 1.33 GB AdamW state over the 166.1 M trainable params) -> 4 saves per
      # arm. The last is the release artefact; the others exist so a job that
      # hits the 48 h submitit timeout can be resumed with
      # `trainer.resume_from_state=<newest step_*.ckpt>` instead of silently
      # restarting from step 0 with a fresh head.
      # No validation: scored later by masked BirdSet evaluation against the
      # saved checkpoint, not on-line. See the header.
      trainer.validate_amount: 0
      trainer.save_checkpoints: true
      trainer.save_every_n_steps: 25000
      # trainer/train.yaml logs every step, which is right for a 1250-step probe
      # and 100 000 W&B rows of loss here.
      trainer.log_every_n_steps: 50
      trainer.resume_from_checkpoint: ${paths.ckpt_dir}/XC_nasa_1M.ckpt
