# @package _global_

# Baseline: XenoCanto + NASA soundscape (BioScape + S2L) in pretraining, drawing
# one RANDOM 5 s segment per recording per epoch (via HTTP-range partial reads),
# instead of the curated detection events used in pretrain_xc_pam_new.yaml.
#
# Weights are the MixedStreamingDataset draw frequencies, so they match the
# curated-events run's soundscape sample fraction (XC 75% / BSC ~8% / S2L ~17%),
# making the random-crop baseline directly comparable. Tune freely — no code
# depends on the exact values.

defaults:
  - override /data: pretrain
  - override /data/datasets: [pretrain/xc_raw, pretrain/nasa_bioscape, pretrain/nasa_s2l]

data:
  weights: [384, 43, 85]  # [xc_raw, nasa_bioscape, nasa_s2l]
