defaults:
  # Block-diagonal layerwise prototypical head: the default readout. Swap it per
  # arm with `module/model=proto/vit`, `linear/vit`, ... (see
  # configs/module/model/ and the sweeps under configs/experiment/sweeps/).
  - model: layerwise/vit_blockdiag
  - loss: asymmetric_loss_multilabel
  - metrics: [map, map_per_class, auroc, t1]


optimizer:
  # Effective LR = base_lr * batch_size / 256 (linear scaling rule)
  base_lr: 3e-4
  prototype_lr: 0.01 #4e-2
  layer_weights_lr: 0.01  # layerwise-fusion softmax weights; cooler than the head to avoid premature block collapse (layerwise probing only)
  weight_decay: 3e-4
  betas: [0.9, 0.95]
  layer_decay: 0.75

scheduler:
  warmup_steps: 0.10
  min_lr: 1.0e-6
