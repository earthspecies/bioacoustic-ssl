_target_: soundscape_ssl.models.ViTProtoLayerwise
img_size: [128, 512]
patch_size: 16
in_chans: 1
embed_dim: 768
depth: 12
num_heads: 12
mlp_ratio: 4.0
drop_rate: 0.0
attn_drop_rate: 0.0
drop_path_rate: 0.1
norm_eps: 1.0e-6
grad_checkpoint: false
pos_embed_type: sinusoidal_2d
qkv_norm: true

# Classification head
num_classes: ${data.num_classes}
num_prototypes: 20
head_drop: 0.0

# Layerwise probing: learned softmax-weighted sum over all `depth` block outputs.
# layer_norm=true applies an independent LayerNorm per block before the weighted
# sum so layers with different activation scales are comparable.
layer_norm: true
