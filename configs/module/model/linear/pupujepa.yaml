# PupuJEPA-Base with a single linear head on the mean-pooled patch tokens. Same
# backbone and the same caveats as `proto/pupujepa.yaml` — only the head differs,
# so proto-vs-linear on this backbone is a clean contrast.
defaults:
  - /module/model/backbone/pupujepa@_here_
  - _self_

_target_: soundscape_ssl.models.PupuJepaClassifier

# Classification head: mean pooling over the encoder's (already norm-ed) patch
# tokens -> nn.Linear. PupuJEPA has no CLS token, and this mean *is* the clip
# embedding upstream's own `embed.py` publishes, so unlike the proto arm's
# mean-token substitution there is nothing approximate about it — the pooling is
# the model's own. Against `linear/vit` (pool: cls) the contrast is CLS-vs-mean
# read-out, which is what "no CLS token" forces.
num_classes: ${data.num_classes}
head_drop: 0.0
