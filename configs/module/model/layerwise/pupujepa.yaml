# PupuJEPA-Base with the layerwise-fusion proto head. Same backbone and the same
# caveats as `proto/pupujepa.yaml` (weights loaded at construction so
# `trainer.resume_from_checkpoint` must be null, no CLS token so focal similarity
# references the mean patch token, 1000 tokens at 5 s).
defaults:
  - /module/model/backbone/pupujepa@_here_
  - _self_

_target_: soundscape_ssl.models.PupuJepaProtoLayerwise

# Classification head
num_classes: ${data.num_classes}
num_prototypes: 20
head_drop: 0.0

# Layerwise probing: learned softmax-weighted sum over all `depth` block outputs.
# layer_norm=true applies an independent LayerNorm per block before the weighted
# sum so layers with different activation scales are comparable.
layer_norm: true
