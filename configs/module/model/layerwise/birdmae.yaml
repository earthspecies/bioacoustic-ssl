# Bird-MAE-Base with the layerwise-fusion proto head. Same backbone and the same
# pairing as `proto/birdmae.yaml` (`data/transforms=birdmae`, the converted
# birdmae_base checkpoint).
defaults:
  - /module/model/backbone/vit_external@_here_
  - _self_

_target_: bioacoustic_ssl.models.ViTProtoLayerwise

# Classification head
num_classes: ${data.num_classes}
num_prototypes: 20
head_drop: 0.0

# Layerwise probing: learned softmax-weighted sum over all `depth` block outputs.
# layer_norm=true applies an independent LayerNorm per block before the weighted
# sum so layers with different activation scales are comparable.
layer_norm: true
