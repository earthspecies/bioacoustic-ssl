defaults:
  - /module/model/backbone/vit@_here_
  - _self_

_target_: soundscape_ssl.models.ViTProtoLayerwise

# Classification head over the full Xeno-Canto label space (10 799 taxa).
num_classes: ${data.num_classes}
num_prototypes: 20
head_drop: 0.0

# The ONLY difference from layerwise/vit. `dense` — every class's logit reading a
# learned combination of every prototype — is an nn.Linear(num_prototypes *
# num_classes, num_classes), i.e. quadratic in num_classes: 2.4 M parameters at
# PER's 132 classes but 2.332 BILLION at 10 799, which is not instantiable. The
# block-diagonal mixer gives each class its own 20 prototypes and nothing else
# (the standard PPNet formulation), so the mixer is 0.23 M parameters and the
# head is 166.1 M, dominated by the prototypes themselves.
#
# This is a real protocol difference from the six published arms' probes, which
# all used the dense mixer, and it is why this run is a release artefact rather
# than another row in the ablation.
mixer: block_diagonal

# Bounds peak activation memory, exactly (top-k pooling is per-prototype, so
# chunking the similarity computation along the prototype axis changes nothing
# numerically — verified against the unchunked path, values and gradients).
#
# Without it the cosine-similarity tensor is (batch, 20 * 10799, 8, 32) =
# 28.3 GB in bf16 at batch 256, which fits on no GPU. At 4096 prototypes per
# chunk the same tensor peaks at 0.54 GB. `null` (the default, and what every
# published probe used) computes it in one shot, which is fine at 132 classes
# (0.3 GB) and impossible here.
proto_chunk: 4096

layer_norm: true

# Fuse only the LAST k blocks. `null` = all 12, the published behaviour.
#
# Set it for long runs. The fusion softmax has no regulariser and keeps moving
# for as long as it is trained: over 100 k steps this head went from centroid
# 8.50 to 7.20 and from 0.198 to 0.351 of its mass on blocks 1-4, while masked
# BirdSet cmAP stayed flat and top-1 fell 0.014. Every per-task probe — which
# stops after 2.5-7.5 k steps — instead puts 0.55-0.88 on blocks 9-12, and
# blocks 5-7 are dead (w < 0.01) in all 16 of them AND in this head at every
# checkpoint. Restricting the pool to 8-12 keeps ~81 % of the probes' mass and
# removes the early attractor outright, so every reachable softmax outcome is a
# sensible one; a lower `layer_weights_lr` or a late-biased init only steers
# inside a pool that still contains the bad outcomes (and a too-cold LR freezes
# near the uniform init, which resurrects the dead blocks at 1/12 each).
#
# Changing this changes the shape of `layer_weights` and `layer_norms`, so a
# checkpoint trained at one value cannot be loaded at another.
fusion_layers: null
