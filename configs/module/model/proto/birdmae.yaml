# Bird-MAE-Base (DBD-research-group/Bird-MAE-Base) with the shared prototypical
# head. Geometry and the reason `qkv_norm` is off live in `backbone/vit_external`.
# Pair with `data/transforms=birdmae` and the checkpoint produced by
# `scripts/convert_external_ckpt.py birdmae_base`.
defaults:
  - /module/model/backbone/vit_external@_here_
  - _self_

_target_: soundscape_ssl.models.ViTProtoFloat

# Classification head — identical to the other proto arms, so the comparison is
# about the backbone.
num_classes: ${data.num_classes}
num_prototypes: 20
head_drop: 0.0
