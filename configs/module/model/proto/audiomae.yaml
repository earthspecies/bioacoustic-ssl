# AudioMAE (facebookresearch/AudioMAE, AudioSet-2M) with the shared prototypical
# head, probed at AudioMAE's own 5 s geometry. Geometry and the reason `qkv_norm`
# is off live in `backbone/vit_external`. Pair with `data/transforms=audiomae`
# and the checkpoint produced by `scripts/convert_external_ckpt.py audiomae`.
defaults:
  - /module/model/backbone/vit_external@_here_
  - _self_

_target_: bioacoustic_ssl.models.ViTProtoFloat

# Classification head — identical to the other proto arms, so the comparison is
# about the backbone.
num_classes: ${data.num_classes}
num_prototypes: 20
head_drop: 0.0
