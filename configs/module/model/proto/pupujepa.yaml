# PupuJEPA-Base with the shared prototypical head. Backbone, weight loading and
# geometry live in `backbone/pupujepa` — note in particular that weights arrive
# at construction, so `trainer.resume_from_checkpoint` must be null.
defaults:
  - /module/model/backbone/pupujepa@_here_
  - _self_

_target_: soundscape_ssl.models.PupuJepaProtoFloat

# Classification head — identical to the other proto arms, so the comparison
# is about the backbone. PupuJEPA has no CLS token, so the focal-similarity
# subtraction uses the mean patch token as the global reference (which is the
# clip embedding upstream's own `embed.py` publishes). That substitution is the
# one part of the cross-arm comparison that is not like-for-like.
num_classes: ${data.num_classes}
num_prototypes: 20
head_drop: 0.0
