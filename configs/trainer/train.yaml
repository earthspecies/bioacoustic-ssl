accelerator: gpu
devices: 1
strategy: auto
precision: bf16-mixed
max_steps: ${data.datasets.max_steps}
# Number of validation passes spread over the run. 0 disables validation
# entirely -- for runs scored later against a saved checkpoint rather than
# on-line (the full-XC classifier).
validate_amount: 15
grad_clip: 2.0
log_every_n_steps: 1
save_every_n_steps: 500000
# Off by default: the benchmark probes have no use for a ~1 GB checkpoint each,
# and 60 of them would fill the disk. Long runs (e.g. the full-XC classifier)
# turn it on together with a real `save_every_n_steps`.
save_checkpoints: false
# A state checkpoint written by birdset_eval.py's own _save_checkpoint, to
# continue a run that hit the 48 h submitit timeout. Restores model + optimizer
# + scheduler + step, unlike `resume_from_checkpoint` below, which only reads
# `encoder.*` out of a PRETRAINING checkpoint and always starts at step 0.
resume_from_state: null
# A PRETRAINING checkpoint whose `encoder.*` weights initialise the backbone.
# `null` = randomly initialised encoder, which is the only thing a clean clone
# can run; every probe arm points it at a file under `${paths.ckpt_dir}`.
resume_from_checkpoint: null

