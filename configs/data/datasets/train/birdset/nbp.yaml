max_steps: 3000

train:
  _target_: alp_data.DatasetConfig
  dataset_name: xeno-canto-raw
  sample_rate: 32000
  split: all
  output_take_and_give:
    audio_bytes: audio_bytes
    label: label
  transformations: 
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID
      cast_class: 
        _target_: polars.Int64
    - _target_: soundscape_ssl.data.FilterFixConfig
      type: filter_fix
      property: gbifID
      values: &cls [8012314, 9317615, 2492949, 5229493, 9705453, 2495000, 2487871, 5229490, 7901064, 2484916, 2490310, 2490604, 2492956, 2490669, 5231190, 7626513, 2490246, 8104397, 2488949, 5845582, 2493091, 5231763, 8077224, 9330514, 2492462, 2487879, 2480537, 9990095, 2487843, 9409796, 2492350, 2494686, 2495708, 2490719, 6093527, 2494422, 7660710, 2494200, 9515886, 2492822, 2493012, 5231438, 2495696, 2477968, 7806848, 9809229, 2492576, 9629160, 2487883, 2494543, 2495455]
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID
      cast_class: 
        _target_: polars.List
        inner:
          _target_: polars.Int64
    - _target_: soundscape_ssl.data.MultiLabelFromFeatureConfig
      type: mulitlabel_from_feature
      is_multilabel: True
      feature: gbifID
      class_ids: *cls

test:
  _target_: alp_data.DatasetConfig
  dataset_name: birdset
  sample_rate: 32000
  split: NBP-test_5s
  output_take_and_give:
    audio: audio
    label: label
  transformations: 
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID_multispecies
      extract_all_regex: \d+
      cast_class: 
        _target_: polars.List
        inner:
          _target_: polars.Int64
    - _target_: soundscape_ssl.data.MultiLabelFromFeatureConfig
      type: mulitlabel_from_feature
      is_multilabel: True
      feature: gbifID_multispecies
      class_ids: *cls