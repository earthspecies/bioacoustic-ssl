# Full Xeno-Canto species classification — the training half of the HF model
# release. Same shape as the `train/birdset/*` configs (they already train on
# Xeno-Canto and only differ in which species they keep), with two changes:
#
#   * no species filter on the train side. The BirdSet configs use
#     `FilterFixConfig` to cut XC down to one task's 21-132 species; here the
#     class universe IS all of XC, so nothing is filtered out.
#   * the test side is XC's own held-out `validation` split rather than a BirdSet
#     test split, so it monitors the same distribution it trains on. It is small
#     (9 332 recordings covering 3 337 of the 11 737 species) — a training
#     monitor, not an evaluation. The evaluation is BirdSet with logit masking,
#     run separately against the final checkpoint.
#
# `validation` does contain 11 species that `train` does not, and a class with no
# training audio is not a class this head can predict, so the test side keeps the
# include-filter: those rows are dropped rather than mapped to a null label
# (MultiLabelFromFeature's `label_map.get` would silently yield None).
#
# The label space is Xeno-Canto's, not BirdSet's, and it is not bird-only:
# 9 887 Aves (691 876 recordings, 94 % of the audio), 1 007 Insecta, 673
# Amphibia, 170 Mammalia. So the released head is a multi-taxon classifier and
# masking it down to a BirdSet task's species is masking against non-bird
# negatives too.
#
# The 11 737 gbifIDs come from `metadata/xc_v0.2.0_classes.parquet`, generated by
# `scripts/build_xc_label_space.py`, rather than being inlined here — one place
# for the label space, and the run config W&B stores stays small. A class's
# output index is the rank of its gbifID in ascending order, because
# MultiLabelFromFeature builds its map as `sorted(set(class_ids))`. That is the
# contract BirdSet logit masking reads back.

# ~35 epochs at batch 256 (734 910 recordings = 2 871 steps/epoch).
max_steps: 100000

train:
  _target_: alp_data.DatasetConfig
  dataset_name: xeno-canto-raw
  sample_rate: 32000
  split: train
  version: 0.2.0
  output_take_and_give:
    audio_bytes: audio_bytes
    label: label
  transformations:
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID
      cast_class:
        _target_: polars.List
        inner:
          _target_: polars.Int64
    - _target_: soundscape_ssl.data.MultiLabelFromFeatureConfig
      type: mulitlabel_from_feature
      is_multilabel: True
      feature: gbifID
      class_ids:
        _target_: soundscape_ssl.data.class_ids_from_parquet
        path: metadata/xc_v0.2.0_classes.parquet

test:
  _target_: alp_data.DatasetConfig
  dataset_name: xeno-canto-raw
  sample_rate: 32000
  split: validation
  version: 0.2.0
  output_take_and_give:
    audio_bytes: audio_bytes
    label: label
  transformations:
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID
      cast_class:
        _target_: polars.Int64
    - _target_: soundscape_ssl.data.FilterFixConfig
      type: filter_fix
      property: gbifID
      values:
        _target_: soundscape_ssl.data.class_ids_from_parquet
        path: metadata/xc_v0.2.0_classes.parquet
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID
      cast_class:
        _target_: polars.List
        inner:
          _target_: polars.Int64
    - _target_: soundscape_ssl.data.MultiLabelFromFeatureConfig
      type: mulitlabel_from_feature
      is_multilabel: True
      feature: gbifID
      class_ids:
        _target_: soundscape_ssl.data.class_ids_from_parquet
        path: metadata/xc_v0.2.0_classes.parquet
