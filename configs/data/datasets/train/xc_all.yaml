# Full Xeno-Canto species classification — the training half of the HF model
# release. Same shape as the `train/birdset/*` configs (they already train on
# Xeno-Canto and only differ in which species they keep), with two changes:
#
#   * no species filter on the train side. The BirdSet configs use
#     `FilterFixConfig` to cut XC down to one task's 21-132 species; here the
#     class universe IS all of XC, so nothing is filtered out.
#   * the test side is XC's `validation` split rather than a BirdSet test split.
#     Note that the train side is `all`, which is `train` + `validation`, so this
#     is **not** held out — it would report training loss under another name. It
#     exists so the config composes; keep `trainer.validate_amount: 0`, as
#     `experiment/xc_classifier/vit_layerwise.yaml` does. The evaluation is
#     BirdSet with logit masking, run separately against the final checkpoint.
#
# The label space is Xeno-Canto's, not BirdSet's, and it is not bird-only:
# 9 733 Aves (588 141 recordings, 98.6 % of the audio), 508 Amphibia, 423
# Insecta, 135 Mammalia. So the released head is a multi-taxon classifier and
# masking it down to a BirdSet task's species is masking against non-bird
# negatives too.
#
# The 10 799 gbifIDs come from `metadata/xc_v0.1.0_all_classes.parquet`,
# generated by `scripts/build_xc_label_space.py`, rather than being inlined here
# — one place for the label space, and the run config W&B stores stays small. A
# class's output index is the rank of its gbifID in ascending order, because
# MultiLabelFromFeature builds its map as `sorted(set(class_ids))`. That is the
# contract BirdSet logit masking reads back.
#
# **The label space must be rebuilt whenever the train split or version below
# changes.** It is built from exactly this (version, split) pair, and the two
# have silently diverged once already: with the space frozen from v0.2.0 `train`
# while this trained on v0.1.0 `all`, 8 gbifIDs fell outside it (targets silently
# became all-ones, now a hard error in MultiHotEncoder) and 946 output units had
# no training audio. Rebuild with
# `uv run python scripts/build_xc_label_space.py --version <v> --split <s>`.

# ~43 epochs at batch 256 (596 526 recordings = 2 331 steps/epoch); ~86 at the
# batch 512 that `data/loaders: pretrain` actually sets.
max_steps: 100000

train:
  _target_: alp_data.DatasetConfig
  dataset_name: xeno-canto-raw
  sample_rate: 32000
  split: all
  version: 0.1.0
  output_take_and_give:
    audio_bytes: audio_bytes
    label: label
  transformations:
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID
      cast_class:
        _target_: polars.List
        inner:
          _target_: polars.Int64
    - _target_: soundscape_ssl.data.MultiLabelFromFeatureConfig
      type: mulitlabel_from_feature
      is_multilabel: True
      feature: gbifID
      class_ids:
        _target_: soundscape_ssl.data.class_ids_from_parquet
        path: metadata/xc_v0.1.0_all_classes.parquet

test:
  _target_: alp_data.DatasetConfig
  dataset_name: xeno-canto-raw
  sample_rate: 32000
  split: validation
  # Pinned rather than left to XenoCanto.DEFAULT_VERSION: the label space is
  # built from one (version, split) pair and both sides must name the same one.
  version: 0.1.0
  output_take_and_give:
    audio_bytes: audio_bytes
    label: label
  transformations:
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID
      cast_class:
        _target_: polars.Int64
    # A no-op while the train split is `all` (every validation class is in the
    # universe by construction), kept so the test side still drops rather than
    # null-labels a class the head has no output for if the splits change.
    - _target_: soundscape_ssl.data.FilterFixConfig
      type: filter_fix
      property: gbifID
      values:
        _target_: soundscape_ssl.data.class_ids_from_parquet
        path: metadata/xc_v0.1.0_all_classes.parquet
    - _target_: soundscape_ssl.data.CastConfig
      type: cast
      property: gbifID
      cast_class:
        _target_: polars.List
        inner:
          _target_: polars.Int64
    - _target_: soundscape_ssl.data.MultiLabelFromFeatureConfig
      type: mulitlabel_from_feature
      is_multilabel: True
      feature: gbifID
      class_ids:
        _target_: soundscape_ssl.data.class_ids_from_parquet
        path: metadata/xc_v0.1.0_all_classes.parquet
