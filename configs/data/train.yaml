defaults:
  - _self_
  - transforms: default
  - loaders: default
  - datasets: train/birdset/hsn

weights: null


class_weighting:
  enabled: true
  label_column: label   # mapped multi-hot label column produced by MultiLabelFromFeature
  alpha: 0.5            # 0 = uniform (no reweighting), 1 = full inverse-frequency balance
  seed: ${seed}

num_classes: null

cache:
  enabled: false
  dir: null            # null -> ~/.cache/soundscape_ssl ; override e.g. $SLURM_TMPDIR, /scratch/...
  size_limit_gb: 100
